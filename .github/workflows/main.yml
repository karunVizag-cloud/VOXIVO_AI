name: Build VOXIVO AI APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. ప్రాజెక్ట్ కోడ్‌ను చెకౌట్ చేస్తుంది
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. ప్రాజెక్ట్ రూట్ పాత్‌ను ఆటోమేటిక్‌గా గుర్తిస్తుంది (రూట్ లేదా VOXIVO_AI సబ్-ఫోల్డర్)
      - name: Auto-Detect Project Root
        id: locate-root
        run: |
          if [ -f "./settings.gradle.kts" ] || [ -f "./settings.gradle" ]; then
            echo "Project root is repository root (.)"
            echo "ROOT_DIR=." >> $GITHUB_ENV
          elif [ -f "./VOXIVO_AI/settings.gradle.kts" ] || [ -f "./VOXIVO_AI/settings.gradle" ]; then
            echo "Project root is ./VOXIVO_AI"
            echo "ROOT_DIR=./VOXIVO_AI" >> $GITHUB_ENV
          else
            FOUND_DIR=$(dirname $(find . -maxdepth 3 -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1))
            echo "Auto-detected project directory: $FOUND_DIR"
            echo "ROOT_DIR=${FOUND_DIR:-.}" >> $GITHUB_ENV
          fi

      # 3. Java 17 (JDK 17) ని సెటప్ చేస్తుంది
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 4. ఆండ్రాయిడ్ లైసెన్సులు & Android 35 Platform Tools సెటప్
      - name: Setup Android SDK & Licenses
        run: |
          echo "Accepting Android Licenses..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true

      # 5. అధికారిక Gradle 8.7 ని రన్నర్‌లో సిద్ధం చేస్తుంది
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 6. gradlew ఫైల్స్ మిస్ కాకుండా నిర్ధారించి ఎగ్జిక్యూట్ అనుమతులు ఇస్తుంది
      - name: Ensure Gradle Wrapper
        working-directory: ${{ env.ROOT_DIR }}
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found. Generating wrapper with Gradle 8.7..."
            gradle wrapper --gradle-version 8.7 --distribution-type bin
          fi
          chmod +x ./gradlew
          ls -la ./gradlew

      # 7. Debug APK ని బిల్డ్ చేస్తుంది
      - name: Build Android APK
        working-directory: ${{ env.ROOT_DIR }}
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      # 8. తయారైన APK ని Artifact గా అప్‌లోడ్ చేస్తుంది (పాత్ ఆటో-డిటెక్ట్ అవుతుంది)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoxivoAI-app-debug
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 7
