name: Build VOXIVO AI APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. ప్రాజెక్ట్ కోడ్‌ను చెకౌట్ చేస్తుంది
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. ప్రాజెక్ట్ రూట్ ఫోల్డర్‌ను సరిచేయడం (రూట్‌లో ఉన్నా లేదా VOXIVO_AI సబ్-ఫోల్డర్‌లో ఉన్నా రూట్‌కి మూవ్ చేస్తుంది)
      - name: Normalize Project Root Directory
        run: |
          echo "Checking project directory structure..."
          if [ ! -f "settings.gradle.kts" ] && [ -d "VOXIVO_AI" ]; then
            echo "Detected VOXIVO_AI subfolder. Flattening files to repository root..."
            shopt -s dotglob
            mv VOXIVO_AI/* .
            rmdir VOXIVO_AI || true
          fi
          echo "Root files:"
          ls -la

      # 3. Java 17 (JDK 17) ని సెటప్ చేస్తుంది
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 4. ఆండ్రాయిడ్ లైసెన్సులు, SDK 35 & local.properties సెటప్
      - name: Set up Android SDK & Licenses
        run: |
          echo "Accepting Android SDK licenses..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "Installing platform-tools and Android 35 SDK..."
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true
          # Android SDK పాత్‌ను local.properties లో సెట్ చేయడం
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      # 5. gradlew & wrapper jar ఫైల్స్ మిస్ కాకుండా సురక్షితంగా సిద్ధం చేయడం (BUILD FAILED రాకుండా)
      - name: Ensure Gradle Wrapper & Permissions
        run: |
          echo "Preparing Gradle Wrapper..."
          mkdir -p gradle/wrapper

          # gradlew స్క్రిప్ట్ లేకపోతే డౌన్‌లోడ్ చేస్తుంది
          if [ ! -f "./gradlew" ]; then
            echo "Downloading gradlew..."
            curl -sSL -o gradlew https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradlew
          fi

          # gradle-wrapper.jar లేకపోతే డౌన్‌లోడ్ చేస్తుంది
          if [ ! -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Downloading gradle-wrapper.jar..."
            curl -sSL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          fi

          # ఎగ్జిక్యూట్ అనుమతులు ఇవ్వడం
          chmod +x ./gradlew
          echo "Gradle wrapper ready:"
          ls -la ./gradlew ./gradle/wrapper/

      # 6. VOXIVO AI Debug APK ని బిల్డ్ చేస్తుంది
      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      # 7. తయారైన APK ఫైల్‌ను Artifact గా అప్‌లోడ్ చేస్తుంది
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoxivoAI-app-debug
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 7
